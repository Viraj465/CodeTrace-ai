[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codetrace-ai"
version = "1.0.3"
description = "Governed, local-first code intelligence for AI agents: call graphs, blast radius, cited answers, MCP server — any LLM, including Ollama"
readme = "README.md"
# torch==2.5.1 has no Windows/macOS wheels for 3.13+, so cap here rather than
# let pip fail deep inside dependency resolution.
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Viraj Sawant", email = "sawantviraj465@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities"
]
# 👇 Updated Keywords List
keywords = [
    "cli", "ai", "llm", "rag", "agent", "mcp", "static-analysis",
    "reverse-engineering", "code-visualization", "call-graph", 
    "ast", "tree-sitter", "chromadb", "hybrid-search",
    "code-intelligence", "developer-tools", "architecture"
]

# These are derived from your specific library list
dependencies = [
    "rich>=14.3.3",
    "pydantic>=2.12.5",
    "typer[all]>=0.24.1",
    "httpx>=0.28.0",
    "pathspec",
    "python-dotenv>=1.2.1",
    "tree-sitter>=0.25.2",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-java",
    "tree-sitter-go",
    "tree-sitter-c",
    "litellm",
    "tree-sitter-cpp",
    "tree-sitter-rust",
    "tree-sitter-php",
    "tree-sitter-html",
    "tree-sitter-json",
    "tree-sitter-css",
    # New languages
    "tree-sitter-c-sharp",
    "tree-sitter-swift",
    "tree-sitter-kotlin",
    "tree-sitter-bash",
    "torch==2.5.1",
    "sentence-transformers==3.4.1",
    "transformers==4.48.3",
    "chromadb>=1.5.2",
    "networkx>=3.6.1",
    "fastapi>=0.134.0",
    "watchfiles>=1.1.1",
    "tiktoken>=0.12.0",
    "uvicorn>=0.41.0",
    "markitdown>=0.1.5",
    "nest-asyncio>=1.6.0",
    "flashrank>=0.2.10",
    "mcp>=1.26.0",
    # Memory reporting. system_info falls back to per-platform stdlib probes
    # without it, but psutil is the accurate cross-platform source.
    "psutil>=5.9",
    # Alt-parser dependencies (YAML, TOML, SQL, Dockerfile)
    "pyyaml>=6.0",
    "sqlglot>=25.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.urls]
"Homepage" = "https://codetraceai.in"
"Repository" = "https://github.com/Viraj465/CodeTrace-ai"
"Bug Tracker" = "https://github.com/Viraj465/CodeTrace-ai/issues"
"Changelog" = "https://github.com/Viraj465/CodeTrace-ai/releases"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "black",
    "isort"
]

[project.scripts]
# This is the "Magic Link"
# Command 'codetrace' will run the 'app' object inside 'src/main.py'
codetrace = "src.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "codetrace_mcp*"]

[tool.setuptools.package-data]
"src" = ["core/parser/queries/*.scm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
